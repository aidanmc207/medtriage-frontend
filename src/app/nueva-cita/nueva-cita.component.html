<main class="page">
  <header>
    <h1>Nueva cita</h1>
    <p>Completa los datos para registrar una cita médica.</p>
  </header>

  <form #form="ngForm" (ngSubmit)="crearCita()">
    <label for="pacienteId">ID del paciente</label>
    <input
      id="pacienteId"
      name="pacienteId"
      type="number"
      min="1"
      required
      [(ngModel)]="pacienteId"
    />

    <label for="doctorId">ID del doctor</label>
    <input
      id="doctorId"
      name="doctorId"
      type="number"
      min="1"
      required
      [(ngModel)]="doctorId"
    />

    <label for="fechaCita">Fecha y hora</label>
    <input
      id="fechaCita"
      name="fechaCita"
      type="datetime-local"
      required
      [(ngModel)]="fechaCita"
    />

    <label for="nivelPrioridad">Prioridad</label>
    <select
      id="nivelPrioridad"
      name="nivelPrioridad"
      required
      [(ngModel)]="nivelPrioridad"
    >
      <option value="ALTA">Alta</option>
      <option value="MEDIA">Media</option>
      <option value="BAJA">Baja</option>
    </select>

    <label for="motivoConsulta">Motivo de consulta</label>
    <textarea
      id="motivoConsulta"
      name="motivoConsulta"
      rows="3"
      maxlength="255"
      required
      [(ngModel)]="motivoConsulta"
    ></textarea>

    <label for="montoConsulta">Monto de consulta</label>
    <input
      id="montoConsulta"
      name="montoConsulta"
      type="number"
      min="0"
      step="0.01"
      required
      [(ngModel)]="montoConsulta"
    />

    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }

    <div class="actions">
      <a class="cancel-button" routerLink="/citas">Cancelar</a>
      <button type="submit" [disabled]="form.invalid || guardando">
        {{ guardando ? 'Guardando...' : 'Crear cita' }}
      </button>
    </div>
  </form>
</main>
